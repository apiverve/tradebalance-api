openapi: 3.0.4
info:
  title: Trade Balance
  description: >-
    Trade Balance provides monthly US international trade data - exports,
    imports, and the resulting goods-and-services trade balance (deficit or
    surplus) on a Balance of Payments basis. Each month comes with the previous
    month's balance, and paid plans add month-on-month and year-on-year changes,
    rolling 12-month totals and the last 12 months.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/tradebalance:
    get:
      summary: Trade Balance
      description: >-
        Get the US trade balance for the latest or a given month, with
        month-on-month and year-on-year changes and rolling 12-month totals.
      operationId: tradebalance
      parameters:
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional date in YYYY-MM format for historical lookup. Omit for
            current data.
          example: 2023-06
        - name: history
          in: query
          schema:
            type: boolean
          required: false
          description: Include the 12 monthly readings ending at the returned month
          example: true
        - name: changes
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include the previous month's balance, month-on-month and
            year-on-year changes and rolling 12-month totals
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  yearMonth: 2026-08
                  year: 2026
                  month: 8
                  exports: 315182
                  imports: 420754
                  balance: -105572
                  unit: millions_usd
                  exportsFormatted: $315.18 billion
                  importsFormatted: $420.75 billion
                  balanceFormatted: -$105.57 billion
                  tradeStatus: deficit
                  updatedAt: '2026-10-28T03:39:54.665Z'
                  previousYearMonth: 2026-07
                  previousBalance: -92826
                  exportsChange1m: 1.435
                  importsChange1m: 4.2632
